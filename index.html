<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SST Tecnoproyectos - Diligenciamiento en Línea</title>
    <!-- Tailwind CSS para un diseño profesional -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librerías para manipular PDFs y Firmas -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-8">
        <!-- Encabezado -->
        <div class="border-b pb-4 mb-6 text-center">
            <h1 class="text-2xl font-bold text-blue-900">TECNOPROYECTOS INGENIERÍA S.A.S.</h1>
            <p class="text-sm text-gray-600">Sistema de Gestión de Seguridad y Salud en el Trabajo (SG-SST)</p>
            <span class="inline-block mt-2 bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full">Diligenciamiento Inteligente de Formatos</span>
        </div>

        <!-- Selector de Formato -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Selecciona el Formato a Diligenciar:</label>
            <select id="formSelect" class="w-full border border-gray-300 rounded-lg p-3 text-gray-800 focus:ring-2 focus:ring-blue-500">
                <option value="FM-SST-14.pdf">FM-SST-14: Registro de Asistencia</option>
                <option value="FM-SST-15.pdf">FM-SST-15: Registro de Inducción en SST</option>
                <option value="FM-SST-16.pdf">FM-SST-16: Evaluación de Inducción SST</option>
                <option value="FM-SST-32.pdf">FM-SST-32: Entrega de EPP y Dotación</option>
                <option value="FM-SST-45.pdf">FM-SST-45: Análisis de Trabajo Seguro (ATS)</option>
                <option value="FM-SST-46.pdf">FM-SST-46: Inspección Preoperacional de Escalera</option>
            </select>
        </div>

        <!-- Campos de Datos Básicos -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha del Registro</label>
                <input type="date" id="inputFecha" class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo del Trabajador / Asistente</label>
                <input type="text" id="inputNombre" placeholder="Ej. Juan Pérez" class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cédula / Identificación</label>
                <input type="text" id="inputCedula" placeholder="Ej. 72123456" class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cargo u Oficio</label>
                <input type="text" id="inputCargo" placeholder="Ej. Técnico Electricista" class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
        </div>

        <!-- Cuadro de Firma Digital / Táctil -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Firma del Trabajador (Firme con el mouse o el dedo)</label>
            <div class="border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 p-2 relative">
                <canvas id="signatureCanvas" class="w-full h-40 cursor-crosshair touch-none bg-white rounded"></canvas>
            </div>
            <button type="button" id="clearBtn" class="mt-2 text-sm text-red-600 hover:text-red-800 font-medium">🔄 Limpiar Firma</button>
        </div>

        <!-- Botón de Acción -->
        <button id="generateBtn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-md transition duration-200 text-center">
            📥 Generar y Descargar PDF Oficial Diligenciado
        </button>
    </div>

    <!-- Script de Lógica -->
    <script>
        // Configurar la libreta de firmas
        const canvas = document.getElementById('signatureCanvas');
        const signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(255, 255, 255)' });

        function resizeCanvas() {
            const ratio = Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext('2d').scale(ratio, ratio);
            signaturePad.clear();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        document.getElementById('clearBtn').addEventListener('click', () => {
            signaturePad.clear();
        });

        // Lógica para rellenar y descargar el PDF
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const selectedForm = document.getElementById('formSelect').value;
            const fecha = document.getElementById('inputFecha').value;
            const nombre = document.getElementById('inputNombre').value;
            const cedula = document.getElementById('inputCedula').value;
            const cargo = document.getElementById('inputCargo').value;

            if (!nombre || !cedula) {
                alert('Por favor completa al menos el nombre y la cédula.');
                return;
            }

            try {
                // Cargar el PDF original desde el repositorio de GitHub
                const pdfUrl = selectedForm; // Como está en la misma carpeta raíz
                const existingPdfBytes = await fetch(pdfUrl).then(res => {
                    if (!res.ok) throw new Error("No se pudo cargar el archivo PDF original.");
                    return res.arrayBuffer();
                });

                const pdfDoc = await PDFLib.PDFDocument.load(existingPdfBytes);
                const pages = pdfDoc.getPages();
                const firstPage = pages[0];
                const font = await pdfDoc.embedStandardFont(PDFLib.StandardFonts.Helvetica);

                // Dibujar los textos ingresados en coordenadas clave de la primera página
                firstPage.drawText(`Fecha: ${fecha}`, { x: 50, y: 700, size: 10, font });
                firstPage.drawText(`Nombre: ${nombre}`, { x: 50, y: 680, size: 10, font });
                firstPage.drawText(`Cédula: ${cedula}`, { x: 50, y: 660, size: 10, font });
                firstPage.drawText(`Cargo: ${cargo}`, { x: 50, y: 640, size: 10, font });

                // Si hay firma, estamparla en el PDF
                if (!signaturePad.isEmpty()) {
                    const signatureImageBytes = await fetch(signaturePad.toDataURL()).then(res => res.arrayBuffer());
                    const signatureImage = await pdfDoc.embedPng(signatureImageBytes);
                    firstPage.drawImage(signatureImage, {
                        x: 50,
                        y: 550,
                        width: 150,
                        height: 50,
                    });
                }

                // Guardar y descargar el archivo resultante
                const pdfBytes = await pdfDoc.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `Diligenciado_${selectedForm}`;
                link.click();

                alert('¡Documento generado y descargado con éxito!');
            } catch (error) {
                alert('Hubo un error al generar el PDF. Asegúrate de que los nombres de los archivos PDF subidos coincidan exactamente con las opciones (ej. FM-SST-14.pdf).');
                console.error(error);
            }
        });
    </script>
</body>
</html>
